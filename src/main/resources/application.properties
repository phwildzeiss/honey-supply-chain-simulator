server.port=8081

simulator.cors.allowed-origins=http://localhost:3000,http://localhost:5173

simulator.max-safe-temperature-celsius=40
simulator.max-safe-duration-minutes=60
simulator.random-seed=42

simulator.sensors.transport.violation-probability=0.3
simulator.sensors.warehouse.violation-probability=0.3
simulator.sensors.defrost.violation-probability=0.3

# "Normal" readings are now a typical value (mean) with realistic spread (std-dev) per scenario,
# instead of one flat range shared by transport/warehouse/defrost. max-normal-duration-minutes is
# a sanity cap on the generated duration, separate from the on-chain violation threshold above
# (that only triggers on temperature AND duration together, so a long but cool reading is fine).
simulator.sensors.transport.temperature-mean=18
simulator.sensors.transport.temperature-std-dev=8
simulator.sensors.transport.min-temperature=-5
simulator.sensors.transport.duration-mean-minutes=90
simulator.sensors.transport.duration-std-dev-minutes=45
simulator.sensors.transport.min-duration-minutes=10
simulator.sensors.transport.max-normal-duration-minutes=300

simulator.sensors.warehouse.temperature-mean=20
simulator.sensors.warehouse.temperature-std-dev=3
simulator.sensors.warehouse.min-temperature=10
simulator.sensors.warehouse.duration-mean-minutes=720
simulator.sensors.warehouse.duration-std-dev-minutes=300
simulator.sensors.warehouse.min-duration-minutes=30
simulator.sensors.warehouse.max-normal-duration-minutes=2880

# Covers liquefying regardless of device (Waermeschrank/Tauchwaermer/Melitherm) — deliberately
# not modeled per device (e.g. a Melitherm's brief ~65 degC contact vs. a slower warming cabinet).
simulator.sensors.defrost.temperature-mean=35
simulator.sensors.defrost.temperature-std-dev=3
simulator.sensors.defrost.min-temperature=25
simulator.sensors.defrost.duration-mean-minutes=30
simulator.sensors.defrost.duration-std-dev-minutes=15
simulator.sensors.defrost.min-duration-minutes=10
simulator.sensors.defrost.max-normal-duration-minutes=120

simulator.web3.rpc-url=http://localhost:8545
# Upper bound for one transaction; the largest simulator transaction needs about 155,000 gas. The sending account
# must be able to cover gas limit times gas price up front, so a low limit keeps the required balance small.
simulator.web3.gas-limit=1000000
# Safety margin on the current network gas price, because the base fee can rise before the transaction is included.
simulator.web3.gas-price-margin-percent=25
simulator.web3.receipt-poll-interval-ms=1000
simulator.web3.receipt-poll-attempts=300

simulator.lab-report.water-content-min-percent=15.0
simulator.lab-report.water-content-max-percent=19.5
simulator.lab-report.hmf-min-mg-per-kg=1
simulator.lab-report.hmf-max-mg-per-kg=30
simulator.lab-report.invertase-min-u-per-kg=55
simulator.lab-report.invertase-max-u-per-kg=130
simulator.lab-report.ph-min=3.2
simulator.lab-report.ph-max=4.5
simulator.lab-report.naturally-enzyme-weak-probability=0.1
simulator.lab-report.variety-premium-probability=0.1
simulator.lab-report.variety-local-probability=0.4

simulator.award.gold-probability=0.05
simulator.award.silver-probability=0.10
simulator.award.bronze-probability=0.15

simulator.certification.association-probability=0.05
simulator.certification.eu-organic-probability=0.10
simulator.certification.national-quality-label-probability=0.15

simulator.certification.association-pass-probability=0.40
simulator.certification.eu-organic-pass-probability=0.60
simulator.certification.national-quality-label-pass-probability=0.80

spring.config.import=optional:file:./application-local.properties
